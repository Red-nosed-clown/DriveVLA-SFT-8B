### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
trust_remote_code: true
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true

### quantization
quantization_bit: 4
quantization_method: bitsandbytes

### dataset
dataset: drivevla_trainval_v4_mildsample_train
eval_dataset: drivevla_trainval_v4_mildsample_val
dataset_dir: /home/pc/DriveVLA-SFT-7B/third_party/LLaMA-Factory/data
template: qwen3_vl_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /home/pc/DriveVLA-SFT-7B/results/qwen3vl_8b_drivevla_trainval_v4_mildsample_short
logging_steps: 5
save_steps: 250
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
max_steps: 1000
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
fp16: false
tf32: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 250
