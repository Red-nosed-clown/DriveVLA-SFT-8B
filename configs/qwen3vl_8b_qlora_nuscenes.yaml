model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
train_file: data/nuscenes_vla_sft/train.jsonl
validation_file: data/nuscenes_vla_sft/val.jsonl
output_dir: results/qwen3vl_8b_qlora_nuscenes

seed: 42
max_length: 2048
image_max_pixels: 602112

num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
weight_decay: 0.0
warmup_ratio: 0.03
logging_steps: 5
save_steps: 50
eval_steps: 50
save_total_limit: 2
gradient_checkpointing: true
bf16: true
tf32: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
